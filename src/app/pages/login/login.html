
<div class="contenedor-login">

  <section>
    <h2>Iniciar sesión</h2>

   <div class="formulario-login">
      <div>
         <label>Correo electrónico</label><br>
         <input
          type="email"
          [(ngModel)]="email"
          placeholder="Correo electrónico">
      </div>


       <div>
          <label>Contraseña</label><br>
          <input
           type="password"
           [(ngModel)]="password"
           placeholder="Contraseña">
      </div>
   </div>

    


    <button (click)="login()">
     Iniciar sesión
    </button>

  </section>

</div>
